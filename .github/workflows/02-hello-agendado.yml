name: 02 - Hello World (agendado)

# Disparo programado via cron (UTC). */5 = a cada 5 minutos,
# o menor intervalo permitido pelo GitHub Actions.
on:
  schedule:
    - cron: "*/5 * * * *"

jobs:
  hello:
    runs-on: ubuntu-latest
    steps:
      - name: Diz olá
        run: echo "Hello World! Execução agendada pelo cron."

      - name: Mostra horário da execução
        run: |
          echo "Evento disparador: ${{ github.event_name }}"
          echo "Expressão cron:    ${{ github.event.schedule }}"
          echo "Horário (UTC):     $(date -u)"
          echo "Horário (Manaus):  $(TZ=America/Manaus date)"
