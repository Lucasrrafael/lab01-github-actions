name: 03 - Build (push)

# Disparo automático a cada push na branch main
on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Faz checkout do código
        uses: actions/checkout@v5

      - name: Configura o Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Instala as dependências
        run: npm ci

      - name: Compila o TypeScript
        run: npm run build

      - name: Executa os testes
        run: npm test

      - name: Executa a aplicação compilada
        run: npm start
